name: Dispatch — build and deploy Whatomate (Production)

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      artifact-id: ${{ steps.upload-binary.outputs.artifact-id }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Build production binary
        run: GOOS=linux GOARCH=arm64 make build-prod

      - name: Verify binary
        run: |
          ls -lh whatomate
          file whatomate

      - name: Upload production binary
        id: upload-binary
        uses: actions/upload-artifact@v4
        with:
          name: whatomate-linux-arm64
          path: whatomate

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download production artifact
        uses: actions/download-artifact@v4
        with:
          name: whatomate-linux-arm64
          path: .

      - name: Set executable permission
        run: chmod +x whatomate

      - name: Upload binary to VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          source: whatomate
          target: /opt/whatomate/bin/

      - name: Run database migrations
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          script: |
            set -e
            ACTIVE=$(cat /opt/whatomate/active_color)
            echo "Active deployment: $ACTIVE"
            if [ "$ACTIVE" = "blue" ]; then
              NEW=green
            else
              NEW=blue
            fi
            echo "Running database migrations..."
            # NOTE: `whatomate server -migrate` keeps running after migrations.
            # Run it in the background, wait for the migration completion log,
            # then terminate it so this step exits.
            LOG_FILE="/tmp/whatomate-migrate-${NEW}-$(date +%s).log"
            # Avoid clashing with the blue/green ports (8081/8082). We only need the
            # server command to run migrations; binding a public port is unnecessary here.
            export WHATOMATE_SERVER_HOST="127.0.0.1"
            export WHATOMATE_SERVER_PORT="39081"
            # Use line-buffering so we can reliably detect completion quickly.
            if command -v stdbuf >/dev/null 2>&1; then
              stdbuf -oL -eL /opt/whatomate/bin/whatomate server -config "/opt/whatomate/config/config-$NEW.toml" -migrate -workers=0 >"$LOG_FILE" 2>&1 &
            else
              /opt/whatomate/bin/whatomate server -config "/opt/whatomate/config/config-$NEW.toml" -migrate -workers=0 >"$LOG_FILE" 2>&1 &
            fi
            PID=$!

            # Wait up to 120 seconds for migrations to complete.
            # If the process exits early, propagate its exit code.
            for i in $(seq 1 120); do
              if ! kill -0 "$PID" 2>/dev/null; then
                wait "$PID" || EXIT_CODE=$?
                if grep -q "Migration completed" "$LOG_FILE"; then
                  echo "Migrations completed successfully."
                  exit 0
                fi
                echo "Migration process exited before completion (exit=${EXIT_CODE:-0}). Logs (last 200 lines):"
                tail -n 200 "$LOG_FILE" || true
                exit 1
              fi
              if grep -q "Migration completed" "$LOG_FILE"; then
                echo "Migrations completed successfully."
                kill -TERM "$PID" 2>/dev/null || true
                # Give it a moment to shutdown gracefully.
                for _ in $(seq 1 10); do
                  if ! kill -0 "$PID" 2>/dev/null; then
                    break
                  fi
                  sleep 1
                done
                # If still running, force kill.
                if kill -0 "$PID" 2>/dev/null; then
                  kill -KILL "$PID" 2>/dev/null || true
                fi
                wait "$PID" 2>/dev/null || true
                exit 0
              fi
              sleep 1
            done

            echo "Timed out waiting for migrations to complete (120s). Logs (last 200 lines):"
            tail -n 200 "$LOG_FILE" || true
            kill -TERM "$PID" 2>/dev/null || true
            exit 1

      - name: Blue-Green switch
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          script: |
            set -e
            CADDYFILE=/etc/caddy/Caddyfile
            ACTIVE=$(cat /opt/whatomate/active_color)
            echo "Active Deployment : $ACTIVE"
            if [ "$ACTIVE" = "blue" ]; then
              NEW=green
              OLD=blue
              NEW_PORT=8082
              OLD_PORT=8081
            else
              NEW=blue
              OLD=green
              NEW_PORT=8081
              OLD_PORT=8082
            fi

            echo "Deploying $NEW"

            sudo systemctl start whatomate-$NEW
            sleep 5

            curl -f http://127.0.0.1:$NEW_PORT/health

            sudo sed -i "s/127.0.0.1:$OLD_PORT/127.0.0.1:$NEW_PORT/" $CADDYFILE
            sudo caddy reload --config $CADDYFILE

            echo "$NEW" | sudo tee /opt/whatomate/active_color

            sudo systemctl stop whatomate-$OLD
            echo "Deployment complete. Active color: $NEW"

      - name: Cleanup downloaded artifact
        if: success()
        run: rm -f whatomate

      - name: Delete artifact from GitHub Actions storage
        if: success() && needs.build.outputs.artifact-id != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ARTIFACT_ID="${{ needs.build.outputs.artifact-id }}"
          echo "Deleting artifact ID: $ARTIFACT_ID"
          curl -sS -f -X DELETE -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/$ARTIFACT_ID"
          echo "Artifact deleted successfully"
