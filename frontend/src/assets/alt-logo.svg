<svg width="400" height="200" viewBox="0 0 400 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgsGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#facc15"/>  <!-- Yellow -->
      <stop offset="50%" stop-color="#ef4444"/> <!-- Red -->
      <stop offset="100%" stop-color="#3b82f6"/> <!-- Blue -->
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#0f172a"/>

  <!-- Text -->
  <text 
    x="50%" 
    y="50%" 
    dominant-baseline="middle" 
    text-anchor="middle" 
    font-family="Arial, Helvetica, sans-serif" 
    font-size="80" 
    font-weight="bold" 
    fill="url(#bgsGradient)">
    BGS
  </text>
</svg>